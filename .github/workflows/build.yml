name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Extract version
        run: |
          VER=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION=$VER" >> "$GITHUB_ENV"

      - name: Extract changelog
        run: |
          VER="${{ env.VERSION }}"
          awk -v ver="v$VER" '$0 == "## " ver {flag=1; next} /^## / {if(flag) exit} flag' CHANGELOG.md > /tmp/notes.md
          {
            echo 'NOTES<<EOF'
            cat /tmp/notes.md
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: "NAS Widget v${{ env.VERSION }}"
          body: ${{ env.NOTES }}
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nas-widget-debug
          path: app/build/outputs/apk/debug/*.apk

  paparazzi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Paparazzi record
        run: gradle recordPaparazziDebug --no-daemon --stacktrace > paparazzi.log 2>&1 || true
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Commit screenshots & log back
        run: |
          mkdir -p screenshots
          cp app/src/test/snapshots/images/*.png screenshots/ 2>/dev/null || true
          cp app/build/reports/paparazzi/images/*.png screenshots/ 2>/dev/null || true
          cp paparazzi.log screenshots/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add screenshots/
          if git diff --cached --quiet; then
            echo "NO_CHANGE"
          else
            git commit -m "chore: paparazzi screenshots [skip ci]"
            (git pull --rebase origin main && git push origin main) || echo "SCREENSHOT_PUSH_SKIPPED"
          fi
